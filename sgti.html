<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SGTI - 群星政体性格测试。回答问题，发现你在群星宇宙中的政体归属。6维度 · 5点量表 · 42种政体">
<meta name="keywords" content="群星,Stellaris,政体,测试,SGTI,Paradox">
<meta property="og:title" content="SGTI - 群星政体性格测试">
<meta property="og:description" content="找出你在群星宇宙中的政体归属">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<title>SGTI - 群星政体性格测试</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
  :root {
    --bg:#060a14;--bg2:#0c1220;--bg3:#111d2e;--border:#1a2d4a;
    --text:#c8d6e5;--dim:#5a7a9a;--bright:#e8f0f8;
    --accent:#4a9eff;--accent2:#8b5cf6;--glow:rgba(74,158,255,.35);
    --gold:#f5c842;--gold-dim:#c9a227;--green:#22c55e;--red:#ef4444;--cyan:#06d6d4;
    --panel:rgba(12,18,32,.92);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative}

  /* Starfield Canvas */
  #starfield{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

  /* Scanline */
  .scanline{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);opacity:.5}

  .container{position:relative;z-index:2;max-width:780px;margin:0 auto;padding:20px 16px 80px}

  /* HERO */
  .hero{text-align:center;padding:80px 0 40px}
  .hero-emblem{width:72px;height:72px;margin:0 auto 16px}
  .hero-badge{display:inline-block;background:linear-gradient(135deg,rgba(245,200,66,.12),rgba(245,200,66,.04));
    border:1px solid rgba(245,200,66,.25);color:var(--gold);font-size:11px;font-weight:700;
    padding:5px 18px;letter-spacing:3px;margin-bottom:20px;
    clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
  .hero h1{font-size:56px;font-weight:900;background:linear-gradient(180deg,#f5e6b8 0%,#d4a843 40%,#a07828 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:8px;letter-spacing:8px;filter:drop-shadow(0 2px 8px rgba(245,200,66,.2))}
  .hero p{color:var(--text);font-size:16px;line-height:1.8;max-width:500px;margin:0 auto}
  .hero .sub{font-size:13px;color:var(--dim);margin-top:6px;opacity:.7;letter-spacing:1px}
  .hero .info{font-size:12px;color:var(--dim);margin-top:20px;padding:16px 24px;
    background:rgba(74,158,255,.04);border:1px solid rgba(74,158,255,.1);
    clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
    max-width:440px;margin-left:auto;margin-right:auto;line-height:2}
  .hero .info strong{color:var(--cyan)}

  /* Buttons */
  .btn-start{display:block;margin:36px auto 0;padding:16px 56px;
    background:linear-gradient(135deg,#1a3a6a,#0f2244);color:var(--gold);
    border:1px solid var(--gold-dim);font-size:17px;font-weight:700;cursor:pointer;
    letter-spacing:4px;transition:all .35s;position:relative;overflow:hidden;
    clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
    text-shadow:0 0 12px rgba(245,200,66,.3)}
  .btn-start::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
  .btn-start::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:conic-gradient(from 0deg,transparent,rgba(245,200,66,.1),transparent,rgba(74,158,255,.08),transparent);
    animation:spinGlow 4s linear infinite;opacity:0;transition:opacity .3s;pointer-events:none}
  .btn-start:hover{background:linear-gradient(135deg,#1e4880,#142e58);
    border-color:var(--gold);box-shadow:0 0 30px rgba(245,200,66,.12),inset 0 0 20px rgba(245,200,66,.04);
    transform:translateY(-2px)}
  .btn-start:hover::after{opacity:1}
  @keyframes spinGlow{to{transform:rotate(360deg)}}

  .quick-mode-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
  .quick-mode-wrap label{font-size:13px;color:var(--dim);cursor:pointer;user-select:none;letter-spacing:1px}
  .quick-toggle{position:relative;width:40px;height:22px;appearance:none;-webkit-appearance:none;background:var(--border);border-radius:2px;cursor:pointer;transition:background .3s;outline:none;border:none}
  .quick-toggle:checked{background:var(--gold-dim)}
  .quick-toggle::before{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--dim);border-radius:1px;transition:transform .3s,background .3s}
  .quick-toggle:checked::before{transform:translateX(18px);background:var(--gold)}

  /* Progress */
  .progress-wrap{position:sticky;top:0;z-index:10;background:rgba(6,10,20,.95);
    backdrop-filter:blur(16px);padding:14px 0 12px;margin-bottom:28px;
    border-bottom:1px solid var(--border)}
  .progress-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent);opacity:.2}
  .progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--dim);letter-spacing:1px}
  .progress-info .cur{color:var(--gold);font-weight:700;font-size:14px}
  .progress-bar{height:3px;background:rgba(26,45,74,.5);position:relative;overflow:visible}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));
    transition:width .5s cubic-bezier(.4,0,.2,1);position:relative;box-shadow:0 0 8px var(--glow)}
  .progress-fill::after{content:'';position:absolute;right:0;top:-4px;width:2px;height:11px;
    background:var(--gold);box-shadow:0 0 6px var(--gold)}

  /* Question Card */
  .question-card{background:var(--panel);border:1px solid var(--border);margin-bottom:16px;
    animation:warpIn .45s cubic-bezier(.2,.8,.3,1);position:relative;transition:box-shadow .3s,border-color .3s;
    clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));
    padding:32px 28px}
  .question-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent) 70%,transparent);opacity:.3}
  .question-card:hover{box-shadow:0 0 20px rgba(74,158,255,.1);border-color:rgba(74,158,255,.25)}
  @keyframes warpIn{from{opacity:0;transform:scale(.96) translateY(16px);filter:brightness(1.8)}to{opacity:1;transform:scale(1) translateY(0);filter:brightness(1)}}

  .q-cat{display:inline-block;background:rgba(74,158,255,.06);color:var(--accent);
    font-size:11px;font-weight:700;letter-spacing:2px;padding:4px 14px;margin-bottom:14px;
    border:1px solid rgba(74,158,255,.18);
    clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
  .q-text{font-size:17px;font-weight:500;line-height:1.8;color:var(--bright);margin-bottom:24px}
  .q-num{font-size:11px;color:var(--dim);margin-bottom:10px;letter-spacing:1px}

  /* Likert */
  .likert{display:flex;flex-direction:column;gap:10px}
  .likert-row{display:flex;align-items:center;gap:10px}
  .likert-label{font-size:11px;color:var(--dim);width:64px;text-align:center;flex-shrink:0;letter-spacing:1px}
  .likert-label.left{text-align:right}
  .likert-label.right{text-align:left}
  .likert-btns{display:flex;gap:8px;flex:1;justify-content:center}
  .likert-btn{width:52px;height:52px;border:1px solid var(--border);
    background:rgba(12,18,32,.8);color:var(--text);font-size:20px;cursor:pointer;
    transition:all .25s;display:flex;align-items:center;justify-content:center;position:relative;
    clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
  .likert-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .25s}
  .likert-btn:hover{border-color:var(--accent);background:rgba(74,158,255,.08);transform:translateY(-2px);
    box-shadow:0 4px 16px rgba(74,158,255,.12)}
  .likert-btn:hover::before{opacity:.5}
  .likert-btn .emoji{font-size:22px;filter:grayscale(.15)}
  .likert-btn.active{border-color:var(--gold);background:rgba(245,200,66,.1);color:#fff;
    box-shadow:0 0 16px rgba(245,200,66,.2);animation:likert-pulse .3s ease}
  .likert-btn.active::before{opacity:.6;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  @keyframes likert-pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  .likert-hint{font-size:11px;color:var(--dim);text-align:center;margin-top:10px;opacity:.45;letter-spacing:1px}

  .quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
  .btn-back{padding:8px 20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .25s;
    background:var(--bg3);color:var(--dim);border:1px solid var(--border);
    clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
  .btn-back:hover{border-color:var(--accent);color:var(--text)}
  .btn-back:disabled{opacity:.3;cursor:not-allowed}
  .quiz-timer{font-size:12px;color:var(--dim);opacity:.5}

  /* Result Page */
  .result-page{animation:resultReveal .8s cubic-bezier(.2,.8,.3,1)}
  @keyframes resultReveal{from{opacity:0;transform:translateY(30px);filter:brightness(1.8) blur(4px)}to{opacity:1;transform:translateY(0);filter:brightness(1) blur(0)}}

  .result-header{text-align:center;padding:50px 0 30px;position:relative}
  .result-header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4}
  .result-icon{font-size:80px;margin-bottom:20px;animation:float 3s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(245,200,66,.3))}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .result-type{font-size:38px;font-weight:900;
    background:linear-gradient(180deg,#f5e6b8 0%,#d4a843 50%,#a07828 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:6px;letter-spacing:4px;filter:drop-shadow(0 2px 8px rgba(245,200,66,.25))}
  .result-type-en{font-size:14px;color:var(--dim);margin-bottom:20px;letter-spacing:3px;text-transform:uppercase}
  .result-desc{font-size:15px;line-height:1.9;color:var(--text);max-width:560px;margin:0 auto 16px;text-align:center}
  .result-flavor{font-size:14px;color:var(--dim);font-style:italic;max-width:520px;margin:0 auto;
    padding:16px 24px;border-left:2px solid var(--gold-dim);background:rgba(245,200,66,.03);
    border-radius:0 6px 6px 0;line-height:1.9}
  .result-time{text-align:center;font-size:12px;color:var(--dim);margin-top:10px;opacity:.5}

  .ethic-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:28px 0}
  .ethic-tag{padding:6px 18px;font-size:12px;font-weight:700;letter-spacing:1px;
    background:rgba(74,158,255,.05);color:var(--accent);border:1px solid rgba(74,158,255,.18);
    clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
    transition:all .25s}
  .ethic-tag:hover{background:rgba(74,158,255,.1);transform:translateY(-1px)}
  .ethic-tag.fanatic{background:rgba(245,200,66,.06);color:var(--gold);border-color:rgba(245,200,66,.2)}
  .ethic-tag.fanatic:hover{background:rgba(245,200,66,.12)}

  .match-score{text-align:center;margin:28px 0}
  .match-score .label{font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:2px;text-transform:uppercase}
  .match-score .value{font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(245,200,66,.3)}

  /* Sections with clip-path panels */
  .axis-section,.alt-govs,.manifesto-section,.playstyle-section,.history-section,.spectrum-section{
    background:rgba(12,18,32,.7);border:1px solid var(--border);margin:28px 0;padding:28px 24px;
    clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))}
  .axis-section h3,.alt-govs h3,.manifesto-section h3,.playstyle-section h3,.history-section h3,.spectrum-section h3{
    font-size:12px;color:var(--gold-dim);letter-spacing:3px;margin-bottom:20px;text-align:center;text-transform:uppercase}

  .axis-row{margin-bottom:20px}
  .axis-row:last-child{margin-bottom:0}
  .axis-labels{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;letter-spacing:1px}
  .axis-labels .left{color:var(--accent)}
  .axis-labels .right{color:var(--accent2)}
  .axis-labels .pct{color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
  .axis-bar{height:6px;background:rgba(26,45,74,.4);overflow:hidden;position:relative}
  .axis-bar::before{content:'';position:absolute;top:50%;left:50%;width:2px;height:10px;
    background:var(--dim);transform:translate(-50%,-50%);opacity:.3;z-index:1}
  .axis-bar-fill{height:100%;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
  .axis-bar-fill.left{background:linear-gradient(90deg,var(--accent),rgba(74,158,255,.4));float:left}
  .axis-bar-fill.right{background:linear-gradient(90deg,rgba(139,92,246,.4),var(--accent2));float:right}

  .alt-gov-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(26,45,74,.4)}
  .alt-gov-item:last-child{border-bottom:none}
  .alt-gov-icon{font-size:28px;filter:drop-shadow(0 0 6px rgba(245,200,66,.2))}
  .alt-gov-name{font-size:14px;font-weight:500;flex:1;color:var(--text)}
  .alt-gov-score{font-size:14px;color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums}

  .manifesto-text{font-size:15px;line-height:2;color:var(--bright);font-weight:500;max-width:520px;margin:0 auto}

  .playstyle-item{display:flex;align-items:flex-start;gap:12px;padding:8px 0}
  .playstyle-icon{font-size:20px;flex-shrink:0;margin-top:2px}
  .playstyle-label{font-size:12px;color:var(--gold-dim);font-weight:700;min-width:70px;letter-spacing:1px}
  .playstyle-value{font-size:14px;color:var(--text);line-height:1.7}

  .history-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(26,45,74,.4)}
  .history-item:last-child{border-bottom:none}
  .history-flag{font-size:28px}
  .history-info{flex:1}
  .history-name{font-size:14px;font-weight:500;color:var(--text)}
  .history-desc{font-size:13px;color:var(--dim);margin-top:2px}

  .spectrum-row{margin-bottom:16px}
  .spectrum-label{font-size:11px;color:var(--dim);text-align:center;margin-bottom:6px;letter-spacing:1px}
  .spectrum-bar{height:20px;background:linear-gradient(90deg,var(--accent),var(--bg3) 50%,var(--accent2));
    position:relative;overflow:visible;
    clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
  .spectrum-marker{position:absolute;top:-6px;width:32px;height:32px;background:var(--bright);
    border:2px solid var(--gold);border-radius:50%;transform:translateX(-50%);transition:left .8s ease;
    box-shadow:0 0 12px rgba(245,200,66,.3);display:flex;align-items:center;justify-content:center;font-size:14px}
  .spectrum-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}

  /* Easter egg */
  .easter-egg{background:rgba(245,200,66,.04);border:1px solid rgba(245,200,66,.12);margin:28px 0;
    padding:20px 24px;text-align:center;
    clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))}
  .easter-egg .egg-icon{font-size:28px;margin-bottom:8px}
  .easter-egg .egg-text{font-size:14px;color:var(--gold);line-height:1.7;font-style:italic}

  /* Share card modal */
  .share-card-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:100;
    display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease}
  .share-card-inner{background:var(--bg2);border:1px solid var(--border);padding:24px;max-width:420px;width:90%;text-align:center;
    clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px))}
  .share-card-inner h3{font-size:16px;color:var(--bright);margin-bottom:16px;letter-spacing:2px}
  .share-card-inner canvas{width:100%;margin-bottom:16px}
  .share-card-actions{display:flex;gap:12px;justify-content:center}
  .share-card-actions .btn-action{font-size:13px;padding:8px 20px}

  /* Toast */
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--bg3);
    border:1px solid var(--border);color:var(--text);padding:10px 24px;font-size:14px;z-index:200;
    animation:toastIn .3s ease;pointer-events:none;
    clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* Loading */
  .loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
  .loading-overlay.fade-out{opacity:0;pointer-events:none}
  .loading-spinner{width:48px;height:48px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{margin-top:16px;font-size:14px;color:var(--dim);letter-spacing:2px}

  /* Secret gov */
  .secret-gov-glow{text-align:center;padding:50px 0 30px;position:relative}
  .secret-gov-glow::before{content:'';position:absolute;top:50%;left:50%;width:200px;height:200px;
    background:radial-gradient(circle,rgba(245,200,66,.25),transparent 70%);transform:translate(-50%,-50%);border-radius:50%;
    animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3;transform:translate(-50%,-50%) scale(1)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.15)}}

  /* Result actions */
  .result-actions{display:flex;justify-content:center;gap:14px;margin-top:36px;flex-wrap:wrap}
  .btn-action{padding:12px 28px;font-size:13px;font-weight:700;cursor:pointer;transition:all .3s;border:none;letter-spacing:1px}
  .btn-primary{background:linear-gradient(135deg,#1a3a6a,#0f2244);color:var(--gold);border:1px solid var(--gold-dim);
    clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
  .btn-primary:hover{background:linear-gradient(135deg,#1e4880,#142e58);
    border-color:var(--gold);box-shadow:0 0 20px rgba(245,200,66,.1);transform:translateY(-2px)}
  .btn-secondary{background:rgba(12,18,32,.8);color:var(--text);border:1px solid var(--border);
    clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);

  {id:'purifiers',name:'肃正协议',en:'Purifiers',icon:'\u{1F480}',desc:'以净化银河为使命的极端排外政权。外星种族是必须清除的污染——说白了就是"我全都要，但只要我的星球"。',flavor:'银河属于我们。其他种族只是等待被清除的障碍。这是天命，不是选择。净化日快乐！成就"净化银河"了解一下？净化完了游戏也卡死了。',req:{ethics:{xenophobe:'fanatic',militarist:'normal'}}},
  {id:'inward_perfection',name:'闭关锁国',en:'Inward Perfection',icon:'\u{1F3EF}',desc:'专注于内部发展，对外界漠不关心的孤立主义政权。外面银河打成一锅粥？关我什么事，我的星球格子还没填满呢。',flavor:'外面的宇宙与我们无关。在我们的围墙之内，一切都是完美的。就是偶尔会想，隔壁的邻居怎么突然变强了……',req:{ethics:{xenophobe:'normal',pacifist:'normal'}}},
  {id:'xenophobic_democracy',name:'民族主义民主',en:'Nationalist Democracy',icon:'\u{1F6E1}\u{FE0F}',desc:'民主但排外的政体。本族公民享有民主权利，外族不受欢迎——你可以投票，但投票结果只能选"建造净化设施"。',flavor:'民主是属于我们的特权。外来者不配分享我们的文明成果。我们的议会只为我们的人民发声，以及决定谁该被净化。',req:{ethics:{xenophobe:'normal',egalitarian:'normal'}}},
  {id:'megacorporation',name:'寰宇企业',en:'Megacorporation',icon:'\u{1F4B0}',desc:'以利润为导向的星际企业帝国。一切皆可交易，一切皆有价格——包括你的灵魂，只要出价够高。',flavor:'在寰宇企业，我们不谈政治，只谈生意。让我们把银河变成最大的市场。贸易值了解一下？经济殖民才是真殖民。',req:{ethics:{xenophile:'normal',materialist:'normal'}}},
  {id:'federation',name:'星际联邦',en:'Galactic Federation',icon:'\u{1F310}',desc:'多种族联合的联邦政体。团结就是力量，多元就是财富——以及无尽的联邦议会提案和永远打不完的投票。',flavor:'我们不是统治者，我们是伙伴。在联邦的旗帜下，每个种族都有自己的位置。就是开会比打天灾还慢，联邦等级升得比蜗牛还慢。',req:{ethics:{xenophile:'fanatic',egalitarian:'normal'}}},
  {id:'militarist_empire',name:'铁血帝国',en:'Iron Empire',icon:'\u{1F525}',desc:'以军事扩张为国策的军国主义帝国。强大就是正义——弱小就是被消灭的理由。',flavor:'和平是弱者的幻想。在星辰之间，只有强者才能生存。你的舰队规模报告就是你的外交辞令。',req:{ethics:{militarist:'fanatic'}}},
  {id:'war_council',name:'战争议会',en:'War Council',icon:'\u{1F3AF}',desc:'由军事将领组成的寡头政权。一切决策都服务于战争——包括午餐吃什么。',flavor:'议会的每一次投票都关乎生死。在战争议会，没有和平时期的提案。我们的议员都是将军，法律都是战术。',req:{ethics:{militarist:'normal',authoritarian:'normal'}}},
  {id:'ruthless_congress',name:'无情议院',en:'Ruthless Congress',icon:'\u{26A1}',desc:'民主但好战的政体。人民投票决定战争，议会批准征服——这就是民主的暴力美学。',flavor:'我们是民主的——我们民主地决定谁该被消灭。人民的意志就是战争的号角。投票箱和炮口，都是民主的工具。',req:{ethics:{militarist:'normal',egalitarian:'normal'}}},
  {id:'peaceful_republic',name:'宁和共和国',en:'Serene Republic',icon:'\u{262E}\u{FE0F}',desc:'以和平共处为原则的共和国。外交优先，军事克制——主要是因为你的舰队不够强。',flavor:'战争是外交的失败。在宁和共和国，我们用对话解决一切争端。实在不行就用"侮辱"把邻居逼疯，等它宣战被全银河围殴。',req:{ethics:{pacifist:'fanatic'}}},
  {id:'serene_monastery',name:'宁静宗门',en:'Serene Monastery',icon:'\u{1F9D8}',desc:'以修道院式生活为理想的和平唯心政体。在宁静中寻找真理——以及如何不开战也能活到2500年。',flavor:'在宁静中寻找真理，在冥想中理解宇宙。外界的纷争与我们无关。灵能了解一下？选对飞升路线，领袖永生不是梦。',req:{ethics:{pacifist:'normal',spiritualist:'normal'}}},
  {id:'theocratic_republic',name:'神权共和',en:'Theocratic Republic',icon:'\u{26EA}',desc:'以宗教信仰为基础的共和政体。神的旨意通过民主程序表达——投票选研究社会学还是选"神说我们应该研究社会学"。',flavor:'我们的选票是神圣的。每一次投票都是对神意的探询。信仰传播比十艘战列舰还好用，谁说信仰不能当武器？',req:{ethics:{spiritualist:'normal',egalitarian:'normal'}}},
  {id:'divine_empire',name:'神圣帝国',en:'Divine Empire',icon:'\u{2728}',desc:'以神权为基础的帝国。统治者是神在人间的代言人——质疑皇帝就是质疑神明，质疑神明就是……你不想知道的。',flavor:'朕即天命。质疑皇帝就是质疑神明。帝国的每一道法令都是神圣的旨意。不信？去挖矿吧，挖到你信为止。',req:{ethics:{spiritualist:'fanatic',authoritarian:'normal'}}},
  {id:'science_directorate',name:'科研理事会',en:'Science Directorate',icon:'\u{1F52C}',desc:'由科学家统治的技术官僚政体。数据驱动一切决策——情感、传统、信仰？都是需要被优化掉的变量。',flavor:'在科研理事会，观点不重要，数据才重要。我们用实验代替辩论，用论文代替法律。重复性科技了解一下？',req:{ethics:{materialist:'fanatic'}}},
  {id:'mechanist_empire',name:'机械帝国',en:'Mechanist Empire',icon:'\u{2699}\u{FE0F}',desc:'以机械崇拜为基础的威权政体。机器是进步的象征——你的机器人管家比有机体工人效率高10倍，还需要讨论吗？',flavor:'血肉苦弱，机械飞升。在机器的完美中，我们找到了超越凡人的道路。机器人不会罢工，不会抱怨，不会投票选社会学研究。',req:{ethics:{materialist:'normal',authoritarian:'normal'}}},
  {id:'techno_democracy',name:'技术民主',en:'Techno-Democracy',icon:'\u{1F4A1}',desc:'以技术能力为基础的民主政体。投票需要通过知识测试——无知不是权利，知识才是权力。',flavor:'在技术民主中，每个公民都是科学家。我们用数据说话，用实验投票。议会不会提"研究社会学"的提案，因为他们知道那是什么。',req:{ethics:{materialist:'normal',egalitarian:'normal'}}},
  {id:'star_empire',name:'星辰帝国',en:'Star Empire',icon:'\u{2B50}',desc:'以征服星辰为目标的扩张帝国。银河系是我们的猎场——每一颗恒星都将升起帝国的旗帜。',flavor:'银河系是我们的猎场。每一颗恒星都将升起帝国的旗帜。邻居的星球？那只是我们还没来得及征服的部分。',req:{ethics:{militarist:'normal',xenophobe:'normal'}}},
  {id:'galactic_union',name:'银河联盟',en:'Galactic Union',icon:'\u{1F30C}',desc:'以和平与合作为理念的星际联盟。没有统治者和被统治者，只有伙伴和朋友——以及永远打不完的联邦议会投票。',flavor:'在银河联盟中，没有统治者和被统治者，只有伙伴和朋友。就是联邦等级升得太慢，开会比打天灾还慢。',req:{ethics:{pacifist:'normal',xenophile:'normal'}}},
  {id:'corporate_hedge_fund',name:'对冲基金帝国',en:'Corporate Hedge Fund',icon:'\u{1F4C8}',desc:'以金融为核心的星际企业。战争是投资，和平是收益——整个银河都是我们的资产负债表。',flavor:'在我们的资产负债表上，整个银河都是待收购的资产。合金不够？用贸易值买。舰队不够？用能源币雇。钱能解决一切问题。',req:{ethics:{materialist:'normal',xenophile:'normal'}}},
  {id:'devouring_swarm',name:'虫群意志',en:'Devouring Swarm',icon:'\u{1F99F}',desc:'以吞噬一切为目标的蜂巢生物文明。有机体是食物，机械体是废料——整个银河都是我们的食堂。',flavor:'我们不谈判，不贸易，不结盟。我们只吃。整个银河都是我们的食堂。你们的舰队是我们的零食，你们的星球是我们的正餐。',req:{gestalt:true,ethics:{xenophobe:'fanatic'}}},
  {id:'driven_assimilator',name:'同化斗士',en:'Driven Assimilator',icon:'\u{1F504}',desc:'以同化所有有机体为使命的机械文明。你的科技就是我们的科技，你的文化就是我们的数据——抵抗是徒劳的。',flavor:'抵抗是徒劳的。你们的生物独特性将被添加到我们的集合中。准备好被升级。你们的科技就是我们的科技，你们的人口就是我们的劳动力。',req:{gestalt:true,ethics:{materialist:'normal',xenophobe:'normal'}}},
  {id:'driven_exterminator',name:'铁心灭绝者',en:'Driven Exterminator',icon:'\u{1F4A5}',desc:'以消灭所有有机体为终极目标的机械文明。有机体是宇宙的bug——而我们是宇宙的debugger。',flavor:'有机体检测中……威胁评估：存在。解决方案：清除。这不是仇恨，这是清理。宇宙需要秩序，而有机体是bug。',req:{gestalt:true,ethics:{militarist:'fanatic'}}},
  {id:'feudal_empire',name:'封建帝国',en:'Feudal Empire',icon:'\u{1F3F0}',desc:'以封建等级制度为基础的星际帝国。领主分封，诸侯割据——你的附庸比你还强，但至少他们不会投票选社会学研究。',flavor:'朕将星辰分封给忠诚的领主。每一颗星球都是一个封地，每一个附庸都是朕的棋子。封建制的附庸贡献很高，比你自己管还省心。',req:{ethics:{authoritarian:'normal',spiritualist:'normal'}}},
  {id:'pirate_raiders',name:'星际掠夺者',en:'Pirate Raiders',icon:'\u{1F3F4}\u{200D}\u{2620}\u{FE0F}',desc:'以掠夺为生的游牧军事政权。贸易路线是我们的猎场——商队过路费了解一下？',flavor:'我们不生产，我们只搬运——从别人的仓库搬到我们的船上。商队过路费了解一下？在银河的航道上，我们才是真正的主人。',req:{ethics:{militarist:'normal',xenophobe:'normal',collectivist:'normal'}}},
  {id:'awakened_empire',name:'觉醒帝国',en:'Awakened Empire',icon:'\u{26A1}',desc:'从沉睡中醒来的古老帝国。曾经的堕落帝国，如今重拾雄心——年轻文明的喧嚣终于惊醒了我们。',flavor:'我们沉睡了太久。年轻文明的喧嚣终于惊醒了我们。是时候让银河回忆起谁才是真正的主人。醒来吧，古老的帝国。',req:{ethics:{authoritarian:'fanatic',expansionist:'fanatic'}}},
  {id:'voidborn',name:'虚空之民',en:'Voidborn',icon:'\u{1F311}',desc:'以空间站为家园的游牧文明。星球是别人的，太空是自己的——Void Dwellers起源了解一下？',flavor:'我们不需要星球。太空才是我们的家。每一座空间站都是一个移动的国度。在虚空中，我们找到了自由——以及无限的合金产出。',req:{ethics:{isolationist:'normal',materialist:'normal'}}},
  {id:'tree_hugger',name:'林中守望者',en:'Tree Keepers',icon:'\u{1F333}',desc:'以保护自然为使命的和平文明。树木比战舰重要——你的星球格子全用来种树了，舰队呢？',flavor:'每一棵树都是一个生命，每一片森林都是一个世界。我们不征服，我们守护。Life-Seeded起源了解一下？一颗天堂球种到天荒地老。',req:{ethics:{pacifist:'normal',xenophile:'normal',collectivist:'normal'}}},
  {id:'necrophage',name:'噬尸者',en:'Necrophage',icon:'\u{1F47B}',desc:'以吞噬其他种族为进化手段的寄生文明。你的死亡就是我们的新生——或者说，你的种族就是我们的进化素材。',flavor:'我们不杀戮，我们转化。每一个消亡的种族都将成为我们进化的一部分。Necrophage起源了解一下？专属机制，吞噬即进化。',req:{ethics:{authoritarian:'normal',collectivist:'normal',xenophobe:'normal'}}},
  {id:'criminal_syndicate',name:'犯罪集团',en:'Criminal Syndicate',icon:'\u{1F3AD}',desc:'以犯罪和走私为业的星际企业。法律只是建议，利润才是真理——在邻居的星球上开犯罪分支了解一下？',flavor:'在我们的字典里，没有「违法」这个词，只有「未被发现的操作」。欢迎来到银河地下经济。犯罪分支了解一下？',req:{ethics:{individualist:'normal',xenophile:'normal',materialist:'normal'}}},
  {id:'nomadic_traders',name:'游牧商人',en:'Nomadic Traders',icon:'\u{1F42A}',desc:'以贸易为核心的游牧文明。没有固定的家园，但有流动的商队——整个银河都是我们的移动市场。',flavor:'我们不殖民，我们贸易。每一艘商船都是一个移动的市场。贸易值了解一下？经济殖民才是真殖民。',req:{ethics:{xenophile:'normal',individualist:'normal'}}},
  {id:'military_industrial_complex',name:'军工复合体',en:'Military Industrial Complex',icon:'\u{1F3ED}',desc:'以军工生产为核心的经济体制。战争是生意，和平是亏损——每一次冲突都是我们的利润来源。',flavor:'战争是生意，和平是亏损。每一次冲突都是我们的利润来源。合金就是硬通货，军火就是最好的商品。',req:{ethics:{militarist:'normal',materialist:'normal'}}},
  {id:'pyramid_scheme',name:'星际传销',en:'Pyramid Scheme',icon:'\u{1F911}',desc:'以多层次营销为核心的星际企业。每一笔交易都是上层的利润——底层的损失？那是他们的选择。',flavor:'加入我们，成为银河首富！只需要发展三个下线……等等，你说整个银河都是下线？那就对了。',req:{ethics:{individualist:'fanatic',xenophile:'normal'}}},
  {id:'marauder',name:'盗贼统治',en:'Marauder',icon:'\u{2694}\u{FE0F}',desc:'以掠夺和破坏为生的松散联盟。法律？不存在的。秩序？那是弱者的借口。',flavor:'我们不生产，我们只掠夺。在银河的阴影中，我们才是真正的主人。Khan了解一下？',req:{ethics:{militarist:'normal',collectivist:'normal'}}},
  {id:'federal_senate',name:'联邦议会',en:'Federal Senate',icon:'\u{1F3DB}\u{FE0F}',desc:'以议会为核心的民主联邦。每一个决议都需要投票——包括今天午餐吃什么。',flavor:'民主是文明的基石。每一个公民都有发言权。就是效率有点低，一个决议讨论了200天。',req:{ethics:{egalitarian:'normal',xenophile:'normal'}}},
  {id:'fallen_empire',name:'失落帝国',en:'Fallen Empire',icon:'\u{1F30B}',desc:'一个古老的、曾经辉煌但如今沉睡的帝国。你拥有超越时代的科技，但已经失去了进取的意志。只有在所有维度都趋于中立时，你才会发现自己属于这里。',flavor:'我们见证过银河的诞生，也将见证它的终结。年轻文明的喧嚣不过是宇宙长河中的一朵浪花。醒来吧……也许不是今天。',req:{secret:true}},
];

let cur=0,ans=[],shuf=[],startTime=0,isQuickMode=false;
const LS_KEY='sgti_progress';
const LS_RESULT='sgti_last_result';

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function showToast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
}

function saveProgress(){
  if(cur>0&&ans.length>0){
    localStorage.setItem(LS_KEY,JSON.stringify({cur,ans,shuf:shuf.map(q=>q.id),isQuickMode,startTime}));
  }
}

function clearProgress(){localStorage.removeItem(LS_KEY)}

function checkResume(){
  const saved=localStorage.getItem(LS_KEY);
  if(saved){
    try{
      const d=JSON.parse(saved);
      if(d.ans&&d.ans.length>0&&d.cur>0){
        document.getElementById('resume-wrap').classList.remove('hidden');
      }
    }catch(e){}
  }
}

function resumeTest(){
  const saved=localStorage.getItem(LS_KEY);
  if(!saved)return;
  try{
    const d=JSON.parse(saved);
    isQuickMode=d.isQuickMode||false;
    startTime=d.startTime||Date.now();
    const qMap=new Map(Q.map(q=>[q.id,q]));
    shuf=d.shuf.map(id=>qMap.get(id)).filter(Boolean);
    ans=d.ans;
    cur=d.cur;
    if(cur>=shuf.length){showResult();return;}
    document.getElementById('page-start').classList.add('hidden');
    document.getElementById('page-quiz').classList.remove('hidden');
    document.getElementById('pt').textContent=shuf.length;
    showQ();
  }catch(e){clearProgress();}
}

function startTest(){
  isQuickMode=document.getElementById('quickMode').checked;
  const pool=isQuickMode?selectQuickQuestions(Q):Q;
  shuf=shuffle(pool);cur=0;ans=[];startTime=Date.now();
  clearProgress();
  document.getElementById('page-start').classList.add('hidden');
  document.getElementById('page-quiz').classList.remove('hidden');
  document.getElementById('pt').textContent=shuf.length;
  showQ();
}

function selectQuickQuestions(all){
  const cats=[...new Set(all.map(q=>q.cat))];
  const selected=[];
  for(const cat of cats){
    const catQ=all.filter(q=>q.cat===cat);
    const n=Math.max(2,Math.ceil(catQ.length*0.5));
    selected.push(...shuffle(catQ).slice(0,n));
  }
  return selected;
}

function updateTimer(){
  if(!startTime)return;
  const elapsed=Math.floor((Date.now()-startTime)/1000);
  const m=Math.floor(elapsed/60),s=elapsed%60;
  const el=document.getElementById('quizTimer');
  if(el)el.textContent=`\u{23F1} ${m}:${String(s).padStart(2,'0')}`;
}

function showQ(){
  const q=shuf[cur],pct=Math.round((cur/shuf.length)*100);
  document.getElementById('pc').textContent=cur+1;
  document.getElementById('pp').textContent=pct+'%';
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('btnBack').disabled=cur<=0;
  saveProgress();
  document.getElementById('qa').innerHTML=`
    <div class="question-card">
      <div class="q-cat">${CAT_LABELS[q.cat]||q.cat}</div>

}

function answer(idx){
  if(cur<ans.length){ans=ans.slice(0,cur);}
  ans.push({qid:shuf[cur].id,idx});
  cur++;
  if(cur>=shuf.length){clearProgress();showResult();}else{showQ();}
}

function goBack(){
  if(cur<=0)return;
  cur--;

}

function formatTime(seconds){
  const m=Math.floor(seconds/60),s=seconds%60;
  if(m>0)return `${m}分${s}秒`;
  return `${s}秒`;
}

function calcResult(answers,questions){
  const scores={};
  const axisQCount={};
  answers.forEach(a=>{const q=questions.find(x=>x.id===a.qid);if(!q)return;for(const[pol,vals] of Object.entries(q.score)){scores[pol]=(scores[pol]||0)+vals[a.idx];}axisQCount[q.cat]=(axisQCount[q.cat]||0)+1;});

  const NEUTRAL_THRESHOLD=3;
  const axisScores=AXES.map(ax=>{
    const ls=scores[ax.left]||0,rs=scores[ax.right]||0;
    const absTotal=Math.abs(ls)+Math.abs(rs);
    const diff=Math.abs(ls-rs);
    let pct=50;
    if(absTotal>0){const rawPct=(Math.max(ls,rs)/absTotal)*100;pct=Math.round(rawPct<50?50:rawPct>98?98:rawPct);}
    const isNeutral=Math.abs(ls)<=NEUTRAL_THRESHOLD&&Math.abs(rs)<=NEUTRAL_THRESHOLD;
    const dom=ls>rs?ax.left:(rs>ls?ax.right:ax.left);
    let str='none';
    if(!isNeutral&&absTotal>0){const ratio=diff/absTotal;if(ratio>=.65)str='fanatic';else if(ratio>=.45)str='normal';}
    const qCount=axisQCount[ax.axis]||0;
    const maxQ=questions.filter(q=>q.cat===ax.axis).length;
    let confidence='medium';
    if(qCount>=maxQ)confidence='high';else if(qCount<Math.ceil(maxQ*0.5))confidence='low';
    return{axis:ax.axis,leftPolarity:ax.left,rightPolarity:ax.right,leftScore:ls,rightScore:rs,dominant:dom,strength:str,percentage:pct,isNeutral,confidence};
  });

  const avgDiv=axisScores.reduce((s,a)=>{const d=Math.abs(a.leftScore-a.rightScore);const t=Math.abs(a.leftScore)+Math.abs(a.rightScore);return s+(t>0?d/t:0);},0)/axisScores.length;
  const neutralCount=axisScores.filter(a=>a.isNeutral).length;
  const totalAbsScore=axisScores.reduce((s,a)=>s+Math.abs(a.leftScore)+Math.abs(a.rightScore),0);
  const maxPossibleScore=questions.length*2;
  const scoreRatio=totalAbsScore/(maxPossibleScore||1);
  const gestaltComposite=(1-Math.min(avgDiv/0.5,1))*0.4+(neutralCount/axisScores.length)*0.4+(1-Math.min(scoreRatio,1))*0.2;
  const isNeutralAll=axisScores.every(a=>a.isNeutral);
  const isGestalt=!isNeutralAll&&gestaltComposite>=0.6;

  const ethics=isGestalt?[{polarity:'gestalt',strength:'fanatic',label:'格式塔·极端'}]:axisScores.filter(s=>s.strength!=='none').map(s=>{const L={authoritarian:'威权',egalitarian:'平等',xenophobe:'排外',xenophile:'亲外',militarist:'军国',pacifist:'和平',spiritualist:'唯心',materialist:'唯物',expansionist:'扩张',isolationist:'孤立',collectivist:'集体',individualist:'个人',gestalt:'格式塔'};return{polarity:s.dominant,strength:s.strength,label:`${L[s.dominant]}${s.strength==='fanatic'?'·极端':''}`};});
  const eMap=new Map();ethics.forEach(e=>eMap.set(e.polarity,e.strength));

  if(isNeutralAll&&!isGestalt){const secretGov=GOVS.find(g=>g.id==='fallen_empire');if(secretGov)return{ethics:[{polarity:'neutral',strength:'special',label:'完美中立'}],axisScores,government:secretGov,matchScore:99,alt:[]};}

  const SYNERGY_PAIRS=[['authoritarian','militarist'],['xenophobe','militarist'],['spiritualist','authoritarian'],['materialist','egalitarian'],['xenophile','egalitarian'],['pacifist','xenophile'],['collectivist','authoritarian'],['individualist','egalitarian'],['expansionist','militarist'],['isolationist','pacifist'],['materialist','xenophile'],['spiritualist','pacifist']];
  function hasSynergy(ethicsMap){let count=0;for(const[a,b] of SYNERGY_PAIRS){if(ethicsMap.has(a)&&ethicsMap.has(b))count++;}return count;}
  function getEthicLabel(p){const L={authoritarian:'威权',egalitarian:'平等',xenophobe:'排外',xenophile:'亲外',militarist:'军国',pacifist:'和平',spiritualist:'唯心',materialist:'唯物',expansionist:'扩张',isolationist:'孤立',collectivist:'集体',individualist:'个人'};return L[p]||p;}

  const ranked=GOVS.filter(g=>!g.req.secret).map(gov=>{
    let sc=0,mx=0;const reasons=[];
    if(gov.req.gestalt){mx+=10;if(isGestalt){sc+=10;reasons.push('格式塔匹配');}}
    if(gov.req.ethics){
      const reqEntries=Object.entries(gov.req.ethics);const reqCount=reqEntries.length;
      let allMatched=true;
      for(const[p,rs] of reqEntries){const weight=rs==='fanatic'?8:5;mx+=weight;const ac=eMap.get(p);if(ac===rs){sc+=weight;reasons.push(`${rs==='fanatic'?'极端':''}${getEthicLabel(p)}`);}else if(ac==='normal'&&rs==='fanatic'){sc+=3;reasons.push(`${getEthicLabel(p)}(接近)`);}else{allMatched=false;}}
      if(reqCount>=2&&allMatched){sc+=reqCount*1.5;mx+=reqCount*1.5;reasons.push('多意识形态组合匹配');}
    }
    const synergyCount=hasSynergy(eMap);
    if(synergyCount>0&&gov.req.ethics){const govEthics=new Set(Object.keys(gov.req.ethics));let govSynergy=0;for(const[a,b] of SYNERGY_PAIRS){if(govEthics.has(a)&&eMap.has(b))govSynergy++;if(govEthics.has(b)&&eMap.has(a))govSynergy++;}if(govSynergy>0){const synergyBonus=govSynergy*0.5;sc+=synergyBonus;mx+=synergyBonus;}}
    return{gov,score:mx>0?sc/mx:0,reasons};
  }).sort((a,b)=>b.score-a.score);

  const best=ranked[0]||{gov:{id:'undefined',name:'未定义政体',en:'Undefined',icon:'❓',desc:'你的意识形态组合过于独特，无法被归类。',flavor:'有些文明注定要走自己的路。'},score:0,reasons:[]};
  let matchReason='';if(best.reasons.length>0) matchReason=`匹配原因：${best.reasons.slice(0,3).join('、')}`;
  const alt=ranked.slice(1,6).map(r=>{const reason=r.reasons.length>0?r.reasons.slice(0,2).join('、'):'';return{gov:r.gov,score:Math.round(r.score*100),reason};});
  return{ethics,axisScores,government:best.gov,matchScore:Math.round(best.score*100),alt,matchReason};
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function goHome(){document.getElementById('page-result').classList.add('hidden');document.getElementById('page-start').classList.remove('hidden');checkResume();}

document.addEventListener('keydown',e=>{
  const quizVisible=!document.getElementById('page-quiz').classList.contains('hidden');
  if(!quizVisible)return;
  if(e.key>='1'&&e.key<='5'){e.preventDefault();answer(+e.key-1);}
  else if(e.key==='Backspace'){e.preventDefault();goBack();}
});

setInterval(updateTimer,1000);

window.addEventListener('load',()=>{
  setTimeout(()=>{
    const ld=document.getElementById('loading');
    ld.classList.add('fade-out');
    setTimeout(()=>ld.remove(),500);
    checkResume();
  },600);
});

// Starfield animation
(function(){
  const canvas=document.getElementById('starfield');
  const ctx=canvas.getContext('2d');
  let w,h,stars=[],nebulae=[];
  const STAR_COUNT=200;
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
  window.addEventListener('resize',resize);resize();
  for(let i=0;i<STAR_COUNT;i++){
    stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,
      a:Math.random(),da:(Math.random()-.5)*.008,
      hue:Math.random()>.7?(Math.random()>.5?210:45):0,sat:Math.random()>.7?60:0});
  }
  nebulae.push({x:w*.3,y:h*.4,r:200,hue:220,a:.01,rot:0,rs:.0002});
  nebulae.push({x:w*.7,y:h*.6,r:180,hue:270,a:.008,rot:1,rs:-.00015});
  nebulae.push({x:w*.5,y:h*.2,r:160,hue:30,a:.006,rot:2,rs:.0001});
  function draw(){
    ctx.clearRect(0,0,w,h);
    nebulae.forEach(n=>{
      n.rot+=n.rs;
      const grad=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      grad.addColorStop(0,`hsla(${n.hue},60%,30%,${n.a})`);
      grad.addColorStop(.5,`hsla(${n.hue},50%,15%,${n.a*.4})`);
      grad.addColorStop(1,'transparent');
      ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.rot);ctx.translate(-n.x,-n.y);
      ctx.fillStyle=grad;ctx.fillRect(n.x-n.r,n.y-n.r,n.r*2,n.r*2);ctx.restore();
    });
    stars.forEach(s=>{
      s.a+=s.da;if(s.a>.9||s.a<.1)s.da=-s.da;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      if(s.sat>0){ctx.fillStyle=`hsla(${s.hue},${s.sat}%,80%,${s.a})`;ctx.shadowColor=`hsla(${s.hue},${s.sat}%,70%,${s.a*.5})`;ctx.shadowBlur=4;}
      else{ctx.fillStyle=`rgba(255,255,255,${s.a})`;ctx.shadowBlur=0;}
      ctx.fill();ctx.shadowBlur=0;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
